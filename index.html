<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arnold Companies Appraisals</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#111827}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.shell{max-width:1050px;margin:auto;padding:16px}.top{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:26px;margin:0 0 5px}.muted{color:var(--muted);font-size:14px}
.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-top:14px}
.filters{display:flex;gap:8px;overflow:auto;padding:10px 0}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px}
.filter.active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;cursor:pointer}.tile b{display:block;margin-bottom:5px}.tag{font-size:12px;color:var(--muted)}
.back{border:0;background:none;font-weight:bold;padding:8px 0 14px;font-size:15px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:18px;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.full{grid-column:1/-1}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #bfc4cc;border-radius:9px;background:#fff}
textarea{min-height:80px}.choices{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:flex-start;gap:7px;border:1px solid var(--line);padding:9px;border-radius:9px;font-weight:normal;background:#fafafa}.chip input{width:auto;margin-top:2px}
.specrow{border-top:1px solid #eee;padding:10px 0}.specrow:first-child{border-top:0}.specrow .source{font-size:13px;margin-bottom:7px}
.actions{position:sticky;bottom:0;background:rgba(243,244,246,.96);padding:10px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button.action{padding:12px 8px;border:0;border-radius:9px;font-weight:bold}.dark{background:#111827;color:#fff}.light{background:#fff;border:1px solid var(--line)!important}
.notice{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 10px}
@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
@media print{body{background:#fff}.shell{max-width:none;padding:0}.top,.filters,#home,.back,.actions,.notice{display:none!important}.card{border:1px solid #888;border-radius:0;break-inside:avoid}input,textarea,select{border:0;padding:2px 0}.chip{border:0;padding:2px 8px 2px 0}}
</style>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
</head>

 <div class="notice">Email PDF and Save PDF use the completed appraisal. Blank Printable PDF creates a clean one-page blank appraisal for printing or handwriting.</div>`;
 window.scrollTo(0,0);
}
function goHome(){formView.style.display="none";home.style.display="block";current=null;window.scrollTo(0,0)}
function v(id){let e=document.getElementById(id);return e?e.value.trim():""}
function radio(n){let e=document.querySelector(`input[name="${n}"]:checked`);return e?e.value:""}
function line(k,x){return x?`${k}: ${x}\n`:""}
function summary(){let s=`ARNOLD COMPANIES - ${current.title.toUpperCase()}\n\n`;
 s+=line("Date",v("date"))+line("Stock Number",v("stock"))+line("Description Code",v("desc"))+line("Location",v("location"))+line("Unit Traded In On",v("traded"))+line("Sales Initials",v("sales"))+line("Asking Price",v("asking"))+line("Trade Range %",v("trade"));
 s+="\nEQUIPMENT\n"+line("Make",v("make"))+line("Model",v("model"))+line("Size",v("size"))+line("Year",v("year"))+line("Serial Number",v("serial"))+line("Purchased",radio("purchased"));
 s+="\nCONDITION\n"+line("Owner",v("owner"))+line("Previous Owner Phone",v("phone"))+line("OK to Contact",radio("contact"))+line("General Appearance",v("general"))+line("Paint Appearance",v("paint"))+line("Mechanical Condition",v("mechanical"))+line("Hours",v("hours"))+line("Date Hours Taken",v("hoursdate"))+line("Recon Allowance",v("reconallow"))+line("Recon Plan",v("reconplan"));
 let opts=[];current.rows.forEach((r,j)=>{let selected=Array.from(document.querySelectorAll(`[data-row="${j}"]:checked`)).map(x=>x.value);let n=(document.querySelector(`[data-note="${j}"]`)||{}).value||"";n=n.trim();if(selected.length||n)opts.push(r.label+": "+selected.join(", ")+(n?(selected.length?" — ":"")+n:""));});if(opts.length)s+="\nOPTIONS / SPECS\n"+opts.map(x=>"• "+x).join("\n")+"\n";
 s+="\nNOTES\n"+line("Internal Description / Specs",v("internal"))+line("External Specs",v("external"))+line("Base and Options",v("base"))+line("Memo",v("memo"));return s.trim()}
function pdfSafeName(){
  let parts=[current.title, v("make"), v("model"), v("stock") ? "Stock-"+v("stock") : ""].filter(Boolean);
  return parts.join(" - ").replace(/[\/:*?"<>|]+/g,"-")+".pdf";
}

function buildPdf(){
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert("The PDF library has not finished loading. Please wait a moment and try again.");
    return null;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt",format:"letter"});
  const pageW=612, pageH=792, margin=28, gap=16;
  const colW=(pageW-margin*2-gap)/2;
  const leftX=margin, rightX=margin+colW+gap;
  let x=leftX, y=50, col=0;

  // Header
  doc.setFont("helvetica","bold");
  doc.setFontSize(13);
  const titleLines=doc.splitTextToSize("Arnold Companies - "+current.title, pageW-margin*2);
  doc.text(titleLines, margin, 28);
  y = 42 + (titleLines.length-1)*12;

  function nextColumn(){
    if(col===0){ col=1; x=rightX; y=50; return true; }
    return false;
  }

  function ensure(h){
    if(y+h > pageH-34){
      if(!nextColumn()){
        // If the one-page summary is extremely full, compress remaining content
        // rather than creating a second page.
        return false;
      }
    }
    return true;
  }

  function section(t){
    const h=18;
    if(!ensure(h)) return false;
    doc.setFont("helvetica","bold");
    doc.setFontSize(8.5);
    doc.text(t.toUpperCase(),x,y);
    y+=5;
    doc.setLineWidth(.35);
    doc.line(x,y,x+colW,y);
    y+=9;
    return true;
  }

  function row(label,value){
    if(value===undefined || value===null || String(value).trim()==="") return true;
    const val=String(value).trim();
    doc.setFontSize(7.1);
    doc.setFont("helvetica","bold");
    const labelW=78;
    const lines=doc.splitTextToSize(val,colW-labelW);
    const h=Math.max(9,lines.length*8.1);
    if(!ensure(h)) return false;
    doc.text(label+":",x,y);
    doc.setFont("helvetica","normal");
    doc.text(lines,x+labelW,y);
    y+=h;
    return true;
  }

  function bullet(text){
    if(!text) return true;
    doc.setFont("helvetica","normal");
    doc.setFontSize(6.8);
    const lines=doc.splitTextToSize("• "+String(text),colW);
    const h=lines.length*7.7+1;
    if(!ensure(h)) return false;
    doc.text(lines,x,y);
    y+=h;
    return true;
  }

  function currency(value){
    if(!value) return "";
    const n=Number(value);
    return isNaN(n)?value:"$"+n.toLocaleString();
  }

  section("Appraisal Information");
  row("Date",v("date"));
  row("Stock #",v("stock"));
  row("Desc. Code",v("desc"));
  row("Location",v("location"));
  row("Traded In On",v("traded"));
  row("Sales Initials",v("sales"));
  row("Asking Price",currency(v("asking")));
  row("Trade Range",v("trade") ? v("trade")+"%" : "");

  section("Equipment");
  row("Make",v("make"));
  row("Model",v("model"));
  row("Size",v("size"));
  row("Year",v("year"));
  row("Serial #",v("serial"));
  row("Purchased",radio("purchased"));

  section("Condition / Reconditioning");
  row("Owner",v("owner"));
  row("Prev. Owner Phone",v("phone"));
  row("OK to Contact",radio("contact"));
  row("General",v("general"));
  row("Paint",v("paint"));
  row("Mechanical",v("mechanical"));
  row("Hours",v("hours"));
  row("Hours Date",v("hoursdate"));
  row("Recon Allow.",currency(v("reconallow")));
  row("Recon Plan",v("reconplan"));

  const opts=[];
  current.rows.forEach((r,j)=>{
    const selected=Array.from(document.querySelectorAll(`[data-row="${j}"]:checked`)).map(x=>x.value);
    let note=(document.querySelector(`[data-note="${j}"]`)||{}).value||""; note=note.trim();
    if(selected.length||note){
      let text=r.label+": ";
      if(selected.length) text+=selected.join(", ");
      if(note) text+=(selected.length?" — ":"")+note;
      opts.push(text);
    }
  });

  if(opts.length){
    section("Selected Options / Specs");
    opts.forEach(x=>bullet(x));
  }

  const notes=[
    ["Internal Specs",v("internal")],
    ["External Specs",v("external")],
    ["Base / Options",v("base")],
    ["Memo",v("memo")]
  ].filter(x=>x[1]);

  if(notes.length){
    section("Descriptions / Notes");
    notes.forEach(([k,val])=>row(k,val));
  }

  // Footer
  doc.setFont("helvetica","normal");
  doc.setFontSize(6.5);
  doc.text("Arnold Companies - Equipment Appraisal",margin,pageH-16);
  doc.text("One-page appraisal summary",pageW-margin,pageH-16,{align:"right"});

  return doc;
}


function buildBlankPdf(){
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert("The PDF library has not finished loading. Please wait a moment and try again.");
    return null;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt",format:"letter"});
  const W=612,H=792,m=24,fullW=W-m*2;

  function sectionBox(title, top, height){
    doc.setLineWidth(.7);
    doc.rect(m,top,fullW,height);
    doc.setFont("helvetica","bold");
    doc.setFontSize(7.2);
    doc.text(title.toUpperCase(),m+7,top+11);
    doc.setLineWidth(.35);
    doc.line(m,top+16,W-m,top+16);
    return top+27;
  }

  function lineField(label,x,y,w){
    doc.setFont("helvetica","bold");
    doc.setFontSize(6.8);
    doc.text(label,x,y);
    const tw=doc.getTextWidth(label)+4;
    doc.setLineWidth(.35);
    doc.line(x+tw,y+1,x+w,y+1);
  }

  // Title block
  doc.setFont("helvetica","bold");
  doc.setFontSize(13);
  doc.text(doc.splitTextToSize("Arnold Companies - "+current.title, fullW-120),m,23);
  doc.setFont("helvetica","normal");
  doc.setFontSize(6.5);
  doc.text("Blank Printable Appraisal",W-m,23,{align:"right"});

  // Section 1: Appraisal / Equipment Information
  let top=39;
  let y=sectionBox("Appraisal / Equipment Information",top,112);
  const gap=10,cw=(fullW-gap*2)/3;
  const x1=m+7,x2=m+7+cw+gap,x3=m+7+(cw+gap)*2;
  const innerW=cw-7;

  lineField("Date:",x1,y,innerW); lineField("Stock Number:",x2,y,innerW); lineField("Desc. Code:",x3,y,innerW); y+=18;
  lineField("Location:",x1,y,innerW); lineField("Sales Initials:",x2,y,innerW); lineField("Asking Price $:",x3,y,innerW); y+=18;
  lineField("Make:",x1,y,innerW); lineField("Model:",x2,y,innerW); lineField("Year:",x3,y,innerW); y+=18;
  lineField("Size:",x1,y,innerW); lineField("Full Serial Number:",x2,y,cw*2+gap-7); y+=18;

  doc.setFont("helvetica","bold"); doc.setFontSize(6.8); doc.text("Purchased:",x1,y);
  doc.setFont("helvetica","normal");
  doc.rect(x1+45,y-7,7,7); doc.text("New",x1+56,y);
  doc.rect(x1+85,y-7,7,7); doc.text("Used",x1+96,y);
  lineField("Trade Range %:",x2,y,innerW); lineField("Unit Traded In On:",x3,y,innerW);

  // Section 2: Ownership / Condition
  top=159;
  y=sectionBox("Ownership / Condition / Reconditioning",top,118);

  lineField("Owner's Full Name:",x1,y,cw*2+gap-7); lineField("Previous Owner Phone:",x3,y,innerW); y+=18;

  doc.setFont("helvetica","bold"); doc.setFontSize(6.8);
  doc.text("OK to contact previous owner:",x1,y);
  doc.setFont("helvetica","normal");
  doc.rect(x1+108,y-7,7,7); doc.text("Yes",x1+119,y);
  doc.rect(x1+147,y-7,7,7); doc.text("No",x1+158,y);
  y+=18;

  lineField("General Appearance:",x1,y,innerW); lineField("Paint Appearance:",x2,y,innerW); lineField("Mechanical Condition:",x3,y,innerW); y+=18;
  lineField("Engine / Unit Hours:",x1,y,innerW); lineField("Date Hours Taken:",x2,y,innerW); lineField("Recon Allowance $:",x3,y,innerW); y+=18;

  doc.setFont("helvetica","bold"); doc.text("Reconditioning Plan:",x1,y); y+=7;
  doc.setLineWidth(.35); doc.line(x1,y,W-m-7,y); y+=13;
  doc.line(x1,y,W-m-7,y);

  // Section 3: Options
  top=285;
  const notesTop=654;
  const optionHeight=notesTop-top-8;
  y=sectionBox("Equipment-Specific Options",top,optionHeight);

  const optionBottom=top+optionHeight-8;
  const cols=3,cgap=10,colW=(fullW-14-cgap*2)/3;
  let col=0,ox=m+7,oy=y;

  // Estimate and choose readable size while preserving one page.
  let itemCount=0;
  current.rows.forEach(r=>itemCount += 1 + r.options.length);
  let fs=5.7,lead=7.1;
  if(itemCount>100){fs=5.2;lead=6.4}
  if(itemCount>135){fs=4.8;lead=5.8}
  if(itemCount>170){fs=4.4;lead=5.3}

  function nextCol(){ col++; ox=m+7+col*(colW+cgap); oy=y; }

  current.rows.forEach(r=>{
    doc.setFontSize(fs);
    doc.setFont("helvetica","bold");
    const labelLines=doc.splitTextToSize(r.label+":",colW);

    const optionLines=[];
    let cur=[];
    r.options.forEach(opt=>{
      const test=(cur.length?cur.join("   ")+"   ":"")+"[] "+opt;
      if(doc.getTextWidth(test)>colW && cur.length){
        optionLines.push(cur); cur=[opt];
      } else cur.push(opt);
    });
    if(cur.length) optionLines.push(cur);

    const need = labelLines.length*lead + optionLines.length*lead + 7;
    if(oy+need > optionBottom && col<cols-1) nextCol();

    doc.setFont("helvetica","bold");
    doc.text(labelLines,ox,oy);
    oy += labelLines.length*lead + 1;

    doc.setFont("helvetica","normal");
    optionLines.forEach(arr=>{
      let tx=ox;
      arr.forEach(opt=>{
        const box=Math.max(4,fs-0.3);
        doc.rect(tx,oy-box+1,box,box);
        tx += box+3;
        doc.text(opt,tx,oy);
        tx += doc.getTextWidth(opt)+9;
      });
      oy += lead;
    });
    oy += 5;
  });

  // Vertical separators between option columns for easier scanning.
  doc.setLineWidth(.25);
  const sep1=m+7+colW+cgap/2;
  const sep2=m+7+(colW+cgap)*2-cgap/2;
  doc.line(sep1,top+20,sep1,top+optionHeight-7);
  doc.line(sep2,top+20,sep2,top+optionHeight-7);

  // Section 4: Notes
  top=654;
  y=sectionBox("Descriptions / Notes",top,113);
  doc.setFont("helvetica","bold"); doc.setFontSize(6.7);

  doc.text("Internal Description / Specs:",m+7,y); y+=7;
  doc.line(m+7,y,W-m-7,y); y+=14;
  doc.line(m+7,y,W-m-7,y); y+=16;

  doc.text("Base and Options:",m+7,y); y+=7;
  doc.line(m+7,y,W-m-7,y); y+=14;
  doc.line(m+7,y,W-m-7,y); y+=16;

  doc.text("Memo:",m+7,y); y+=7;
  doc.line(m+7,y,W-m-7,y); y+=14;
  doc.line(m+7,y,W-m-7,y);

  doc.setFont("helvetica","normal");
  doc.setFontSize(5.5);
  doc.text("Arnold Companies - Equipment Appraisal",m,H-9);
  doc.text("Blank one-page form",W-m,H-9,{align:"right"});
  return doc;
}

async function blankPdf(){
  const doc=buildBlankPdf(); if(!doc) return;
  const safe=(current.title+" - Blank Appraisal.pdf").replace(/[\\/:*?"<>|]+/g,"-");
  const blob=doc.output("blob");
  const file=new File([blob],safe,{type:"application/pdf"});
  const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent);

  if(isiOS && navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{ await navigator.share({title:safe,files:[file]}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  doc.save(safe);
}

async function emailPdf(){
  const doc=buildPdf(); if(!doc) return;
  const blob=doc.output("blob");
  const file=new File([blob],pdfSafeName(),{type:"application/pdf"});
  const subject=current.title+(v("stock")?" - Stock #"+v("stock"):"");

  if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{
      await navigator.share({
        title:subject,
        text:"Completed Arnold Companies equipment appraisal.",
        files:[file]
      });
      return;
    }catch(e){
      if(e && e.name==="AbortError") return;
    }
  }

  // Desktop/fallback: download the PDF, then open a prepared email.
  doc.save(pdfSafeName());
  setTimeout(()=>{
    location.href="mailto:?subject="+encodeURIComponent(subject)+"&body="+
      encodeURIComponent("Completed appraisal PDF has been generated. Please attach the downloaded PDF to this email.");
  },500);
}

function savePdf(){
  const doc=buildPdf(); if(!doc) return;
  const blob=doc.output("blob");
  const file=new File([blob],pdfSafeName(),{type:"application/pdf"});

  // On iPhone/iPad, Share Sheet is the most reliable way to save to Files.
  const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  if(isiOS && navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    navigator.share({
      title:pdfSafeName(),
      files:[file]
    }).catch(e=>{ if(!e || e.name!=="AbortError") doc.save(pdfSafeName()); });
    return;
  }
  doc.save(pdfSafeName());
}
