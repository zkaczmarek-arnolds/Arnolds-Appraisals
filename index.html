<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arnold Companies Appraisals</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#111827}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.shell{max-width:1050px;margin:auto;padding:16px}.top{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:26px;margin:0 0 5px}.muted{color:var(--muted);font-size:14px}
.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-top:14px}
.filters{display:flex;gap:8px;overflow:auto;padding:10px 0}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px}
.filter.active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;cursor:pointer}.tile b{display:block;margin-bottom:5px}.tag{font-size:12px;color:var(--muted)}
.back{border:0;background:none;font-weight:bold;padding:8px 0 14px;font-size:15px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:18px;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.full{grid-column:1/-1}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #bfc4cc;border-radius:9px;background:#fff}
textarea{min-height:80px}.choices{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:flex-start;gap:7px;border:1px solid var(--line);padding:9px;border-radius:9px;font-weight:normal;background:#fafafa}.chip input{width:auto;margin-top:2px}
.specrow{border-top:1px solid #eee;padding:10px 0}.specrow:first-child{border-top:0}.specrow .source{font-size:13px;margin-bottom:7px}
.actions{position:sticky;bottom:0;background:rgba(243,244,246,.96);padding:10px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button.action{padding:12px 8px;border:0;border-radius:9px;font-weight:bold}.dark{background:#111827;color:#fff}.light{background:#fff;border:1px solid var(--line)!important}
.notice{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 10px}
@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
@media print{body{background:#fff}.shell{max-width:none;padding:0}.top,.filters,#home,.back,.actions,.notice{display:none!important}.card{border:1px solid #888;border-radius:0;break-inside:avoid}input,textarea,select{border:0;padding:2px 0}.chip{border:0;padding:2px 8px 2px 0}}

:root{
  --arnolds-red:#c8102e;
  --arnolds-dark:#1f1f1f;
  --arnolds-gray:#f1f1f1;
  --arnolds-line:#c9c9c9;
}
.brandbar{
  display:flex;align-items:center;gap:18px;
  padding:22px 16px 12px 16px;background:white;border-bottom:4px solid var(--arnolds-red);
  margin:-20px -20px 18px -20px;
}
.brandbar img{height:58px;width:auto;display:block}
.brandbar .brandtitle{font-weight:800;font-size:20px;color:var(--arnolds-dark)}
.brandbar .brandsub{font-size:12px;color:#666;margin-top:2px}
.card,.panel,.section{border-color:var(--arnolds-line)!important}
h1,h2,h3{color:var(--arnolds-dark)}
button.action.dark{
  background:var(--arnolds-red)!important;
  border-color:var(--arnolds-red)!important;
  color:#fff!important;
}
button.action.light{
  background:#fff!important;
  color:var(--arnolds-dark)!important;
  border:1px solid #bcbcbc!important;
}
button.action.light:hover{border-color:var(--arnolds-red)!important}
.chip input:checked{accent-color:var(--arnolds-red)}
.back,.category.active,.filter.active{accent-color:var(--arnolds-red)}
@media(max-width:700px){
  .brandbar{padding:20px 12px 10px 12px;gap:12px}
  .brandbar img{height:44px}
  .brandbar .brandtitle{font-size:17px}
}


.specinputs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.specinput{display:flex;align-items:center;gap:8px;border:1px solid #d2d6dc;border-radius:10px;padding:8px 10px;background:#fff}
.specinput span{font-size:14px;font-weight:600;white-space:nowrap}
.specinput input{width:110px;min-width:90px;padding:8px;border:1px solid #c9c9c9;border-radius:7px;font:inherit}
.specinput input[type=number]{width:82px}
@media(max-width:700px){
  .specinputs{display:grid;grid-template-columns:1fr 1fr}
  .specinput{justify-content:space-between}
  .specinput input{width:100%;max-width:120px}
}

</style>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

function categories(){return ["All",...new Set(FORMS.map(f=>f.category))]}
function renderFilters(){filters.innerHTML=categories().map(c=>`<button class="filter ${c===cat?'active':''}" onclick="cat='${esc(c)}';renderFilters();renderTiles()">${esc(c)}</button>`).join("")}
function renderTiles(){let q=(search.value||"").toLowerCase();let a=FORMS.filter(f=>(cat==="All"||f.category===cat)&&(!q||f.title.toLowerCase().includes(q)||f.category.toLowerCase().includes(q)));tiles.innerHTML=a.map((f,i)=>`<div class="tile" onclick='openForm(${FORMS.indexOf(f)})'><b>${esc(f.title)}</b><span class="tag">${esc(f.category)}</span></div>`).join("")}
function field(id,label,type="text",full=false){
  let control;
  if(id==="location"){
    control=`<select id="location"><option value="">Select location...</option>${STORES.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select>`;
  }else if(type==="textarea"){
    control=`<textarea id="${id}"></textarea>`;
  }else{
    control=`<input id="${id}" type="${type}">`;
  }
  return `<div class="${full?'full':''}"><label>${label}</label>${control}</div>`;
}

function inputDefinitions(r){
  const label=(r.label||"").toLowerCase();
  const opts=r.options||[];
  const defs=[];

  // Generic front/rear tire or track SIZE rows were blank-entry fields on the paper forms.
  if(/^(front|rear) tire\/track size$/.test(label)){
    const side=label.startsWith("front")?"Front":"Rear";
    defs.push({label:side+" Tire/Track Size",type:"text",key:"size"});
    if(opts.some(o=>/duals/i.test(o))) defs.push({label:side+" Duals %",type:"number",key:"duals",min:0,max:100});
    if(opts.some(o=>/triples/i.test(o))) defs.push({label:side+" Triples %",type:"number",key:"triples",min:0,max:100});
    return defs;
  }

  // Tread / wear percentage rows should be entered as percentages, not checked.
  if(/tread\s*%|track\s*%/.test(label) || opts.some(o=>/tread\s*%/i.test(o))){
    // Avoid converting rows that are clearly lists of real tire/track sizes.
    const realSizeChoices=opts.filter(o=>/\d+[\/x.-]\d+|R\d+|tracks?$/i.test(o)).length;
    if(realSizeChoices < 2){
      const pctOpts=opts.filter(o=>/%|tread/i.test(o));
      if(pctOpts.length){
        pctOpts.forEach((o,k)=>{
          let clean=o.replace(/^%+\s*/,"").replace(/\s*%+$/,"").replace(/tread/ig,"").trim();
          if(!clean) clean=(label.includes("front")?"Front":label.includes("rear")?"Rear":"Wear");
          defs.push({label:clean+" %",type:"number",key:"pct"+k,min:0,max:100});
        });
      }else{
        defs.push({label:r.label,type:"number",key:"pct",min:0,max:100});
      }
      return defs;
    }
  }

  // Rows like Tire BrandOther contain Front Tread % / Rear Tread % entry fields.
  if(opts.length && opts.every(o=>/tread\s*%/i.test(o))){
    opts.forEach((o,k)=>defs.push({
      label:o.replace(/\s*%/,"").trim()+" %",
      type:"number",key:"pct"+k,min:0,max:100
    }));
    return defs;
  }

  // Transmission: keep transmission types selectable, but gears are entered numerically.
  if(label==="transmission" && opts.some(o=>/forward gears|reverse gears/i.test(o))){
    opts.forEach((o,k)=>{
      if(/forward gears/i.test(o)) defs.push({label:"Forward Gears",type:"number",key:"fwd",min:0});
      else if(/reverse gears/i.test(o)) defs.push({label:"Reverse Gears",type:"number",key:"rev",min:0});
      else if(/^ranges?$/i.test(o.trim())) defs.push({label:"Ranges",type:"number",key:"ranges",min:0});
    });
    return defs;
  }

  // Tire Appraisal: number of tires and tread % are both numeric entries.
  if(label==="number of tires"){
    defs.push({label:"Number of Tires",type:"number",key:"count",min:0});
    defs.push({label:"Tread %",type:"number",key:"tread",min:0,max:100});
    return defs;
  }

  // A standalone Track % row is a numeric wear field.
  if(label==="track %"){
    defs.push({label:"Track %",type:"number",key:"trackpct",min:0,max:100});
    return defs;
  }

  return defs;
}

function checkboxOptions(r){
  const label=(r.label||"").toLowerCase();
  let opts=[...(r.options||[])];

  // PTO rows: always provide a None choice when PTO selections are applicable.
  // Do not duplicate it if the source row already contains None / No PTO.
  if(/\bpto\b/.test(label) && opts.length && !opts.some(o=>/^(none|no pto)$/i.test(String(o).trim()))){
    opts.push("None");
  }
  if(/^(front|rear) tire\/track size$/.test(label)) return [];
  if(label==="number of tires" || label==="track %") return [];
  if(label==="transmission" && opts.some(o=>/forward gears|reverse gears/i.test(o))){
    return opts.filter(o=>!/forward gears|reverse gears/i.test(o) && !/^ranges?$/i.test(o.trim()));
  }
  if(opts.length && opts.every(o=>/tread\s*%/i.test(o))) return [];
  if(/tread\s*%/.test(label) && !opts.some(o=>/\d+[\/x.-]\d+|R\d+|tracks?$/i.test(o))) return [];
  return opts;
}

function openForm(i){current=FORMS[i];home.style.display="none";formView.style.display="block";
 let specs=current.rows.map((r,j)=>{

  const file=new File([blob],safe,{type:"application/pdf"});
  const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent);

  if(isiOS && navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{ await navigator.share({title:safe,files:[file]}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  doc.save(safe);
}

async function emailPdf(){
  const doc=buildPdf(); if(!doc) return;
  const blob=doc.output("blob");
  const file=new File([blob],pdfSafeName(),{type:"application/pdf"});
  const subject=current.title+(v("stock")?" - Stock #"+v("stock"):"");

  if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{
      await navigator.share({
        title:subject,
        text:"Completed Arnold Companies equipment appraisal.",
        files:[file]
      });
      return;
    }catch(e){
      if(e && e.name==="AbortError") return;
    }
  }

  // Desktop/fallback: download the PDF, then open a prepared email.
  doc.save(pdfSafeName());
  setTimeout(()=>{
    location.href="mailto:?subject="+encodeURIComponent(subject)+"&body="+
      encodeURIComponent("Completed appraisal PDF has been generated. Please attach the downloaded PDF to this email.");
  },500);
}

function savePdf(){
  const doc=buildPdf(); if(!doc) return;
  const blob=doc.output("blob");
  const file=new File([blob],pdfSafeName(),{type:"application/pdf"});

  // On iPhone/iPad, Share Sheet is the most reliable way to save to Files.
  const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  if(isiOS && navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    navigator.share({
      title:pdfSafeName(),
      files:[file]
    }).catch(e=>{ if(!e || e.name!=="AbortError") doc.save(pdfSafeName()); });
    return;
  }
  doc.save(pdfSafeName());
}
